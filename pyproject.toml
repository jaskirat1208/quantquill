[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-quill"
version = "0.1.0"
description = "Quantitative trading strategy platform"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Jaskirat Singh", email = "jaskirat@example.com"},
]
keywords = ["trading", "quantitative", "finance", "algorithms"]
dependencies = [
    "smartapi-python==1.5.5",
    "plotly>=6.6.0",
    "pandas>=2.3.0",
    "logzero>=1.7.0",
    "pyotp>=2.9.0",
    "websocket>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=1.0",
]

[project.scripts]
quantquill-server = "alpha_server.start_alpha_server:main"

[project.urls]
Homepage = "https://github.com/jaskirat1208/quantquill"
Repository = "https://github.com/jaskirat1208/quantquill"
Issues = "https://github.com/jaskirat1208/quantquill/issues"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
